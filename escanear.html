<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escanear matafuego</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <h1>🧯 Escanear QR</h1>
    <nav><a href="index.html">Listado</a><a href="escanear.html">Escanear</a></nav>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Apuntá la cámara al código QR del matafuego</h2>
      <div id="lector"></div>
      <p id="mensaje" class="suave">También podés escanearlo directamente con la cámara del celular.</p>
      <div class="acciones">
        <button id="iniciar" class="boton">Activar cámara</button>
      </div>
    </section>

    <section class="tarjeta">
      <h2>O ingresá el ID manualmente</h2>
      <form id="manual" class="acciones">
        <input id="idManual" class="buscador" style="flex:1;margin:0" placeholder="Ej: MF-001" required>
        <button class="boton" type="submit">Buscar</button>
      </form>
    </section>
  </main>

  <script src="js/vendor/html5-qrcode.min.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const mensaje = document.getElementById("mensaje");
    let lector = null;

    // Acepta una URL de ficha (…/matafuego.html?id=X) o directamente un ID.
    function abrir(texto) {
      let id = texto.trim();
      try {
        const u = new URL(id);
        id = u.searchParams.get("id") || id;
      } catch (_) { /* no es URL: se toma como ID */ }
      location.href = urlFicha(id);
    }

    document.getElementById("iniciar").addEventListener("click", async () => {
      const boton = document.getElementById("iniciar");
      boton.disabled = true;
      lector = new Html5Qrcode("lector");
      try {
        await lector.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (texto) => {
            await lector.stop();
            mensaje.textContent = "QR leído, abriendo ficha…";
            abrir(texto);
          }
        );
        boton.style.display = "none";
        mensaje.textContent = "Buscando código QR…";
      } catch (e) {
        boton.disabled = false;
        mensaje.className = "error";
        mensaje.textContent = "No se pudo acceder a la cámara. Revisá los permisos (se requiere HTTPS).";
      }
    });

    document.getElementById("manual").addEventListener("submit", (ev) => {
      ev.preventDefault();
      abrir(document.getElementById("idManual").value);
    });
  </script>
</body>
</html>
