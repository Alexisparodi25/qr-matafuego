<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escanear matafuego</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <h1>🧯 Escanear matafuego</h1>
    <nav><a href="index.html">Escanear</a><a href="etiquetas.html">Mis etiquetas</a></nav>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Escaneá el código QR del matafuego</h2>
      <p class="suave">La información que trae el QR aparece abajo sola, no hace falta escribir nada.</p>
      <div id="lector"></div>
      <p id="mensaje" class="suave"></p>
      <div class="acciones">
        <button id="iniciar" class="boton">📷 Abrir cámara</button>
        <label class="boton secundario">🖼️ Subir foto del QR
          <input id="foto" type="file" accept="image/*" hidden>
        </label>
      </div>
      <div id="lectorFoto" hidden></div>
    </section>

    <section id="resultado" class="tarjeta" hidden></section>

    <section class="tarjeta">
      <div class="acciones" style="justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h2 style="margin:0">Matafuegos escaneados</h2>
        <div class="acciones">
          <button id="descargar" class="boton secundario">Descargar planilla</button>
          <button id="borrar" class="boton secundario">Borrar lista</button>
        </div>
      </div>
      <p class="suave">Se guardan en este celular o computadora.</p>
      <div id="historial"></div>
    </section>
  </main>

  <script src="js/vendor/html5-qrcode.min.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const CLAVE = "matafuegos-escaneados";
    const mensaje = document.getElementById("mensaje");
    let lector = null;

    // ---------- Interpretar el contenido del QR ----------

    // Devuelve { titulo, campos: [[clave, valor]], link, texto }
    function interpretar(texto) {
      const t = texto.trim();
      const r = { titulo: "", campos: [], link: null, texto: t };

      if (/^https?:\/\//i.test(t)) {
        r.link = t;
        r.titulo = "El QR tiene un link";
        return r;
      }

      if (t.startsWith("{")) {
        try {
          const obj = JSON.parse(t);
          r.campos = Object.entries(obj).map(([k, v]) => [k, Array.isArray(v) ? v.join(" ") : String(v)]);
          r.titulo = obj.id || obj.ID || "Matafuego";
          return r;
        } catch (_) { /* no es JSON: se sigue como texto */ }
      }

      const partes = t.split(/\r?\n|;|\|/).map((p) => p.trim()).filter(Boolean);
      for (const p of partes) {
        const m = p.match(/^([^:=]{1,40}?)\s*[:=]\s*(.+)$/);
        if (m) r.campos.push([m[1].trim(), m[2].trim()]);
        else if (!r.titulo) r.titulo = p;
        else r.campos.push(["Dato", p]);
      }
      if (!r.titulo) r.titulo = "Matafuego";
      return r;
    }

    function htmlResultado(r, fecha) {
      let html = "<h2>" + escapar(r.titulo) + "</h2>";
      if (fecha) html += '<p class="suave">Escaneado el ' + escapar(new Date(fecha).toLocaleString("es-AR")) + "</p>";
      if (r.link) {
        html += '<p>Este QR no trae los datos escritos: lleva a una página web (por lo general, de la empresa de mantenimiento o del fabricante).</p>'
          + '<p style="overflow-wrap:anywhere"><a href="' + escapar(r.link) + '" target="_blank" rel="noopener">' + escapar(r.link) + "</a></p>"
          + '<a class="boton" href="' + escapar(r.link) + '" target="_blank" rel="noopener">Abrir la página del QR</a>';
      } else if (r.campos.length) {
        html += '<dl class="datos">' + r.campos.map(([k, v]) => "<dt>" + escapar(k) + "</dt><dd>" + escapar(v) + "</dd>").join("") + "</dl>";
      } else {
        html += '<p style="white-space:pre-wrap">' + escapar(r.texto) + "</p>";
      }
      return html;
    }

    // ---------- Lista guardada ----------

    function leerLista() {
      try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch (_) { return []; }
    }
    function guardarLista(lista) {
      try { localStorage.setItem(CLAVE, JSON.stringify(lista)); } catch (_) { /* sin almacenamiento disponible */ }
    }

    function renderHistorial() {
      const lista = leerLista();
      const cont = document.getElementById("historial");
      if (!lista.length) {
        cont.innerHTML = '<p class="suave">Todavía no escaneaste ningún matafuego.</p>';
        return;
      }
      cont.innerHTML = '<table class="lista"><tbody>' + lista.map((e, i) => {
        const r = interpretar(e.texto);
        return "<tr><td><b>" + escapar(r.titulo) + '</b><br><span class="suave">' + escapar(new Date(e.fecha).toLocaleString("es-AR")) + "</span></td>"
          + '<td><button class="boton secundario" data-ver="' + i + '">Ver</button></td></tr>';
      }).join("") + "</tbody></table>";
    }

    function mostrar(texto, fecha) {
      const res = document.getElementById("resultado");
      res.innerHTML = htmlResultado(interpretar(texto), fecha);
      res.hidden = false;
      res.scrollIntoView({ behavior: "smooth" });
    }

    function procesar(texto) {
      // QR de nuestras propias etiquetas con link a la ficha: se abre la ficha.
      try {
        const u = new URL(texto.trim());
        if (u.origin === location.origin && u.pathname.endsWith("/matafuego.html")) {
          location.href = u.href;
          return;
        }
      } catch (_) { /* no es URL */ }

      const fecha = new Date().toISOString();
      const lista = leerLista();
      lista.unshift({ fecha, texto });
      guardarLista(lista);
      renderHistorial();
      mostrar(texto, fecha);
      mensaje.className = "suave";
      mensaje.textContent = "QR leído.";
    }

    // ---------- Cámara y foto ----------

    document.getElementById("iniciar").addEventListener("click", async () => {
      const boton = document.getElementById("iniciar");
      boton.disabled = true;
      lector = lector || new Html5Qrcode("lector");
      try {
        await lector.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (texto) => {
            await lector.stop();
            boton.disabled = false;
            boton.textContent = "📷 Escanear otro";
            procesar(texto);
          }
        );
        mensaje.className = "suave";
        mensaje.textContent = "Apuntá la cámara al QR…";
      } catch (e) {
        boton.disabled = false;
        mensaje.className = "error";
        mensaje.textContent = "No se pudo abrir la cámara. Revisá que el navegador tenga permiso, o usá \"Subir foto del QR\".";
      }
    });

    document.getElementById("foto").addEventListener("change", async (ev) => {
      const archivo = ev.target.files[0];
      ev.target.value = "";
      if (!archivo) return;
      mensaje.className = "suave";
      mensaje.textContent = "Leyendo la foto…";
      try {
        const texto = await new Html5Qrcode("lectorFoto").scanFile(archivo, false);
        procesar(texto);
      } catch (_) {
        mensaje.className = "error";
        mensaje.textContent = "No se encontró un QR en la foto. Probá con una foto más cerca y bien enfocada.";
      }
    });

    // ---------- Botones de la lista ----------

    document.getElementById("historial").addEventListener("click", (ev) => {
      const i = ev.target.dataset.ver;
      if (i === undefined) return;
      const e = leerLista()[i];
      if (e) mostrar(e.texto, e.fecha);
    });

    document.getElementById("borrar").addEventListener("click", () => {
      if (!confirm("¿Borrar todos los matafuegos escaneados?")) return;
      guardarLista([]);
      renderHistorial();
      document.getElementById("resultado").hidden = true;
    });

    // Planilla CSV (se abre con Excel): una fila por matafuego, una columna por dato.
    document.getElementById("descargar").addEventListener("click", () => {
      const lista = leerLista();
      if (!lista.length) return alert("Todavía no hay matafuegos escaneados.");
      const filas = lista.map((e) => {
        const r = interpretar(e.texto);
        const f = { "Fecha de escaneo": new Date(e.fecha).toLocaleString("es-AR"), "Matafuego": r.titulo };
        if (r.link) f["Link"] = r.link;
        for (const [k, v] of r.campos) f[k] = f[k] ? f[k] + " / " + v : v;
        if (!r.link && !r.campos.length) f["Contenido"] = r.texto;
        return f;
      });
      const columnas = [...new Set(filas.flatMap(Object.keys))];
      const celda = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
      const csv = [columnas.map(celda).join(";"), ...filas.map((f) => columnas.map((c) => celda(f[c])).join(";"))].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = "matafuegos-escaneados.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    renderHistorial();
  </script>
</body>
</html>
